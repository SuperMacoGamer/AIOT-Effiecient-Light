<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register - SmartLight Planner</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #003c3c, #004d25);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .register-container {
      background-color: #111;
      padding: 40px 30px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      width: 100%;
      max-width: 360px;
      text-align: center;
    }

    h1 {
      color: #4CAF50;
      font-size: 26px;
      margin-bottom: 5px;
    }

    h2 {
      color: #eee;
      font-size: 20px;
      margin-bottom: 10px;
    }

    p {
      font-size: 14px;
      color: #999;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: none;
      border-radius: 8px;
      background-color: #333;
      color: #fff;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background-color: #45a049;
    }

    .switch-link {
      margin-top: 20px;
      font-size: 14px;
      color: #a5d6a7;
    }

    .switch-link a {
      color: #a5d6a7;
      text-decoration: none;
      font-weight: bold;
    }

    .switch-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="register-container">
    <h2>Join</h2>
    <h1>SmartLight Planner</h1>
    <p>Create your account to start planning smart</p>

    <form onsubmit="handleRegister(event)">
      <input type="text" id="new-username" placeholder="Choose a username" required />
      <input type="password" id="new-password" placeholder="Create a password" required />
      <button type="submit">Register</button>
    </form>

    <div class="switch-link">
      Already have an account? <a href="login.html">Log in here</a>
    </div>
  </div>

  <script>
    function handleRegister(event) {
      event.preventDefault();

      const username = document.getElementById('new-username').value;
      const password = document.getElementById('new-password').value;

      const users = JSON.parse(localStorage.getItem('users')) || {};

      if (users[username]) {
        alert("Username already exists. Please choose another one.");
      } else {
        users[username] = password;
        localStorage.setItem('users', JSON.stringify(users));
        alert("Registration successful! You can now log in.");
        window.location.href = "login.html";
      }
    }
  </script>
</body>
</html>
